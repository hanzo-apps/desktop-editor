[package]
name = "desktop-editor"
version = "0.1.0"
edition = "2021"
description = "CodeMirror 6 code editor in a Tauri window — real filesystem tree, syntax highlighting, ⌘S writes through."
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
